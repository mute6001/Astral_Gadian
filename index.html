<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별수호자 · 캐릭터 아카이브</title>
<style>
:root{--bg:#080e1b;--panel:#101b2e;--panel2:#14233b;--line:#2b4263;--text:#edf4ff;--muted:#9fb2d0;--gold:#e7c778;--blue:#78baff;--violet:#b6a0ff;--green:#8de0c0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#203b62 0%,var(--bg) 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
.wrap{max-width:1060px;margin:auto;padding:28px 18px 60px}.hero{display:flex;align-items:center;gap:18px;padding:24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(120deg,#142643dd,#0c1425ee);box-shadow:0 18px 50px #0005}
.emblem{width:76px;height:76px;border-radius:18px;display:grid;place-items:center;font-size:38px;color:var(--gold);background:linear-gradient(145deg,#263e60,#10192c);border:1px solid #526d91;flex-shrink:0}
h1{font-size:clamp(24px,4vw,36px);margin:0;letter-spacing:.02em}.sub{color:var(--muted);margin:4px 0 0}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{border:1px solid #385274;border-radius:99px;padding:4px 10px;color:#d9e7ff;font-size:12px;background:#14233b}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.tab{border:1px solid var(--line);background:#0e192b;color:var(--muted);padding:10px 15px;border-radius:10px;cursor:pointer;font:inherit}.tab.active{background:#203958;color:#fff;border-color:#6a8db9;box-shadow:inset 0 -2px var(--gold)}.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.subtab{font-size:13px;padding:8px 12px}.group-label{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}.subsection{margin-bottom:18px}.character-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat-group{background:linear-gradient(160deg,#13213a,#0d1728);border:1px solid var(--line);border-radius:14px;padding:16px}.stat-group h2{font-size:16px;margin:0 0 12px}.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat-item{display:flex;flex-direction:column;gap:4px}.stat-item label{font-size:12px;color:var(--muted)}.stat-item input{width:100%;min-width:0;background:#07101e;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}.equipment-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.equip-slot{min-height:105px;border:1px solid #385274;border-radius:12px;background:linear-gradient(145deg,#14233b,#0a1425);color:var(--text);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px}.equip-slot:hover{border-color:var(--gold)}.equip-icon{font-size:24px}.equip-name{font-size:13px;font-weight:700}.equip-type{font-size:11px;color:var(--muted)}@media(max-width:600px){.character-grid{grid-template-columns:1fr}.equipment-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:0 0 14px}.hint{color:var(--muted);font-size:13px}.btn{border:1px solid #54769e;background:#203957;color:white;padding:9px 13px;border-radius:9px;cursor:pointer;font:inherit}.btn.primary{background:#d6b86e;color:#171b24;border-color:#f1d993;font-weight:700}.btn:hover,.tab:hover{filter:brightness(1.15)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:linear-gradient(160deg,#13213a,#0d1728);border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}.card h2{font-size:17px;margin:0 0 4px}.en{color:var(--muted);font-size:12px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tag{font-size:11px;border-radius:6px;padding:3px 7px;background:#203653;color:#cfe3ff;border:1px solid #385575}.tag.gold{color:var(--gold);background:#342c1d;border-color:#68542b}.card ul{padding-left:18px;margin:9px 0 0}.card li{margin:4px 0}.card p{margin:8px 0}.section-title{margin:22px 0 10px;font-size:19px}.empty{color:var(--muted);padding:20px}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#07101e;color:var(--text);font:inherit}.field textarea{min-height:160px;resize:vertical}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn.danger{background:#49252c;border-color:#84434c}.savednote{color:var(--green);font-size:12px;margin-top:8px}.promptbox{width:100%;min-height:340px;background:#07101e;color:#dceaff;border:1px solid var(--line);border-radius:12px;padding:15px;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}.notice{font-size:12px;color:var(--muted);margin-top:10px}.importfile{display:none}.prompt-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.footer{margin-top:24px;color:#7f94b5;font-size:12px;text-align:center}
@media(max-width:600px){.fieldgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding:16px 12px 40px}.hero{padding:17px;align-items:flex-start}.emblem{width:56px;height:56px;font-size:28px}.tab{flex:1;padding:9px 8px;font-size:13px}.toolbar{align-items:flex-start}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="emblem">✦</div>
    <div>
      <h1>별수호자 <span style="color:var(--gold)">Astral Guardian</span></h1>
      <p class="sub">별의 힘으로 전열을 지키고, 운명을 반격으로 되돌리는 수호자</p>
      <div class="stats"><span class="pill">최대 MP 500</span><span class="pill">방어 · 보호 · 제어</span><span class="pill">축적형 반격</span></div>
    </div>
  </header>

  <nav class="tabs" aria-label="주요 메뉴">
    <button class="tab top-tab active" data-tab="skills">성좌별 스킬</button>
    <button class="tab top-tab" data-tab="rules">자원·규칙</button>
    <button class="tab top-tab" data-tab="manage">스킬 관리</button>
    <button class="tab top-tab" data-tab="ai">AI 도구</button>
    <button class="tab top-tab" data-tab="character">캐릭터·장비</button>
  </nav>
  <div class="toolbar">
    <span class="hint" id="hint">스킬을 눌러 세부 설정을 확인하는 대신, 필요한 정보를 한눈에 볼 수 있습니다.</span>
    <button class="btn primary" id="copyCurrent">현재 탭 내용 복사</button>
  </div>
  <main id="content"></main>
  <div class="footer">ASTRAL ARCHIVE · 별수호자 스킬 설정 문서</div>
</div>
<script>
let activeSkills = [
{n:"성좌의 성역",en:"Sanctuary of Constellation",lv:"Lv.3",type:"액티브 · 영역 전개",mp:80,cd:"120초",desc:["방패를 대지에 내리꽂아 반경 8m에 10초간 성역 전개.","영역 내 아군: 받는 피해 20% 감소, 초당 최대 HP의 2% 회복.","영역 내 적: 이동 속도 30%, 공격 속도 20% 감소 및 중심 방향으로 끌림.","성역 유지 중 별빛의 수호·부동의 별자리 방어 효과 1.25배 증가."],gold:true},
{n:"별빛의 수호",en:"Astral Aegis",lv:"Lv.5 MAX",type:"액티브 · 방어",mp:35,cd:"12초",desc:["전방에 4초간 성좌의 방패막 전개.","받는 피해 60% 감소.","방어 성공 시 운명의 천칭 에너지 축적량 1.25배 증가."]},
{n:"성좌의 인력",en:"Astral Attraction",lv:"Lv.5 MAX",type:"액티브 · 도발/제어",mp:30,cd:"18초",desc:["반경 7m 내 적을 4초간 도발하고 시전자 방향으로 끌어당김.","적의 방어력 20% 감소.","보스는 강제 이동·방어력 감소 효과가 저항에 따라 약화되거나 무효화될 수 있음."]},
{n:"부동의 별자리",en:"Immovable Constellation",lv:"Lv.2",type:"액티브 · 상태이상 면역",mp:35,cd:"24초",desc:["3초간 넉백·기절·넘어짐 등 강제 이동 및 행동 불능 효과에 면역.","발동 직후 STR 30% 증가, 3초간 지속.","피해 및 특수 기믹 판정은 별도 적용."]},
{n:"운명의 천칭",en:"Scales of Fate",lv:"Lv.2",type:"축적형 반격",mp:25,cd:"방출형",desc:["방패로 방어한 실제 피해량의 50%를 별빛 에너지로 축적.","축적 상한: 최대 HP의 100%에 해당하는 피해량.","다음 무기 공격 적중 시 축적량의 150%를 추가 성좌 피해로 방출.","추가 피해의 30%는 방어력 무시, 치명타 확률 +30%p.","8초 이내 방출하지 않으면 축적량 20% 감소."]},
{n:"운명을 가로지르는 별",en:"Starbound Intercession",lv:"Lv.5 MAX",type:"액티브 · 패시브 복합",mp:50,cd:"20초 / 대상별 내부 쿨 30초",desc:["패시브—별의 부름: 15m 이내 파티원의 HP가 35% 이하가 되면 자동 돌진해 단일 대상 공격 1회를 대신 받음. 대상에게 최대 HP의 20% 보호막 부여.","액티브—별을 잇는 도약: 지정 아군에게 최대 15m 돌진. 3초간 아군이 받는 단일 대상 공격 피해의 50%를 대신 받고, 아군에게 최대 HP의 15% 보호막 부여.","대신 받는 피해에는 시전자의 방어 및 피해 감소 효과 적용.","즉사기·특수 기믹 피해·광역 공격은 대신 받을 수 없음. 대신 받은 피해로 시전자가 사망할 수 있음."]},
{n:"별궤의 발도",en:"Draw of the Starpath",lv:"Lv.1",type:"검 성좌의 길 · 액티브 · 표식",mp:25,cd:"8초",desc:["전방의 적 하나를 빠르게 베어 공격력의 120%만큼 물리 피해를 줌.","적중 시 대상에게 6초간 성흔 1중첩 부여. 성흔은 최대 3중첩까지 적용.","검 성좌의 길 전용 표식이며, 방패 성좌 스킬과는 별도로 작동."]},
{n:"성흔 연쇄",en:"Stellar Mark Combo",lv:"Lv.2",type:"검 성좌의 길 · 액티브 · 연계",mp:35,cd:"14초",desc:["성흔이 새겨진 적을 별빛 참격 3회로 연속 공격. 각 타격은 공격력의 55% 피해를 줌.","대상에게 성흔이 있으면 각 타격 피해가 10% 증가.","각 타격은 일반 적중 효과를 발동하지만, 성흔 중첩을 추가로 부여하지 않음."]},
{n:"유성 관통",en:"Meteor Pierce",lv:"Lv.2",type:"검 성좌의 길 · 액티브 · 관통",mp:45,cd:"20초",desc:["별빛을 검 끝에 집중해 직선으로 찌름. 경로상의 적에게 공격력의 220% 피해.","대상의 방어력을 15% 무시.","성흔이 1중첩 이상인 대상에게 적중하면 추가로 공격력의 40% 피해. 추가 피해는 대상별 1회만 적용."]},
{n:"성좌파쇄",en:"Constellation Breaker",lv:"Lv.3",type:"검 성좌의 길 · 액티브 · 마무리",mp:60,cd:"28초",desc:["단일 대상에게 공격력의 300% 피해를 주고 대상의 성흔을 모두 소모.","소모한 성흔 1중첩마다 피해가 10% 증가. 최대 3중첩, 최대 피해 배율은 공격력의 390%.","성흔이 없더라도 기본 피해는 적용됨."]},
{n:"종성멸천",en:"Astral Extinction",lv:"Lv.5 MAX",type:"검 성좌의 길 · 액티브 · 필살기",mp:90,cd:"60초",desc:["짧게 힘을 모은 뒤 단일 대상에게 공격력의 450% 성좌 피해를 줌.","대상에게 성흔이 있으면 성흔을 모두 소모하고, 소모한 중첩마다 피해가 8% 증가. 최대 3중첩, 최대 피해 배율은 공격력의 558%.","시전 중 군중 제어에 적중하면 공격이 취소될 수 있으며, 취소 시 MP의 50%를 돌려받음."]},
{n:"쌍성개벽",en:"Twin Stars: Genesis",lv:"Lv.1 · MAX",type:"공용 스킬 · 성좌 전환",mp:0,cd:"내부 쿨타임 12시간",desc:["방패 성좌의 길과 검 성좌의 길을 전환한다.","전환 시 선택한 성좌의 스킬 목록과 전투 특성이 적용된다.","성좌 전환 후 12시간 동안 다시 사용할 수 없다. 내부 쿨타임은 전환 시점부터 계산한다.","별도의 피해·보호 효과는 없으며, 성좌 전환 기능만 수행한다."]},
];
let passives = [
{n:"별의 맹세",en:"Oath of the Stars",type:"고유 패시브",desc:["최대 HP 15% 증가.","방어력 10% 증가.","자신이 받는 회복 효과 5% 증가.","방패 장착 시에만 적용."]},
{n:"수호자의 궤도",en:"Guardian's Orbit",type:"방어 패시브",desc:["5m 이내 아군이 피해를 입으면 별의 인장 획득.","최대 5중첩, 중첩당 받는 피해 1% 감소.","최대 중첩 시 다음 별빛의 수호 소모 MP 10 감소.","중첩 획득 내부 쿨타임 1초."]},
{n:"별빛의 저울",en:"Astral Balance",type:"자원 패시브",desc:["별빛의 수호로 방어 시 별빛 에너지 획득량 10% 증가.","운명의 천칭 방출 시 소모 에너지의 5% 회수.","회수량은 축적 상한의 5% 이하."]},
{n:"불굴의 성좌",en:"Unbroken Constellation",type:"생존 패시브",desc:["HP 30% 미만 도달 시 3초간 받는 피해 20% 감소.","발동 쿨타임 90초."]},
{n:"여덟 번째 별",en:"The Eighth Star",type:"상위 패시브",desc:["성좌의 성역 유지 중 자신이 받는 피해 5% 추가 감소.","성역 종료 후 4초간 받는 피해 5% 감소.","두 효과는 중첩되지 않음."]},
{n:"검의 성흔",en:"Sigil of the Sword",type:"검 성좌의 길 · 패시브",desc:["검 성좌의 길 스킬로 적중시키면 대상에게 성흔 1중첩을 부여할 수 있음. 성흔은 대상별 최대 3중첩, 6초 지속.","성흔이 있는 대상에게 주는 검 성좌의 길 피해가 중첩당 2% 증가. 최대 6%.","성흔 부여는 대상별 1초에 한 번만 발동하며, 별궤의 발도는 별도 규칙에 따라 적용."]},
{n:"유성의 박동",en:"Meteor Rhythm",type:"검 성좌의 길 · 공격/유지력 패시브",desc:["검 성좌의 길 스킬 적중 시 5초간 공격력 2% 증가. 최대 4중첩.","중첩은 지속시간이 갱신되며, 최대 공격력 증가량은 8%.","같은 스킬의 다단히트는 시전 1회당 최대 1중첩만 부여.","검 성좌의 길 스킬로 준 최종 피해량의 3%만큼 보호막을 생성한다. 한 번의 스킬 시전당 최대 1회 발동하며, 다단히트는 첫 적중 시에만 보호막 생성을 계산한다.","보호막은 5초간 유지되며, 최대 HP의 8%를 초과할 수 없다. 새 보호막 생성 시 기존 보호막과 중첩하지 않고 지속시간을 갱신한다."]},
{n:"별빛 수확",en:"Starlight Reaping",type:"검 성좌의 길 · 자원 패시브",desc:["성흔이 있는 적에게 검 성좌의 길 스킬로 피해를 주면 MP 3 회복.","대상별 내부 쿨타임 2초. 한 번의 다단히트 스킬은 회복을 최대 1회만 발동.","최대 MP를 초과해 회복하지 않음."]},
{n:"개기식의 일격",en:"Eclipse Strike",type:"검 성좌의 길 · 치명타 패시브",desc:["성흔 3중첩 대상에게 주는 검 성좌의 길 스킬의 치명타 확률 8%p 증가.","치명타 피해량 자체는 증가하지 않음.","성흔이 소모되면 해당 보너스도 즉시 사라짐."]},

function fillEditor(mode){

 if(select)select.addEventListener('change',paint);paint();
 document.getElementById('saveSkill').onclick=()=>{const old=selectedItem();const name=document.getElementById('fName')?.value.trim();if(!name){document.getElementById('editorMsg').textContent='스킬 이름을 입력해주세요.';return;}const obj={n:name,en:document.getElementById('fEn').value.trim(),type:document.getElementById('fType').value.trim(),lv:document.getElementById('fLv').value.trim(),desc:document.getElementById('fDesc').value.split('\\n').map(x=>x.trim()).filter(Boolean)};const mp=document.getElementById('fMp').value.trim();if(mp!=='')obj.mp=Number(mp)||0;obj.cd=document.getElementById('fCd').value.trim();if(mode==='add'){const kind=obj.type.toLowerCase().includes('패시브')?'passive':'active';(kind==='active'?activeSkills:passives).push(obj);}else{if(!old)return;(old._kind==='active'?activeSkills:passives)[old._idx]=obj;}saveData();render(mode);fillEditor(mode);const msg=document.getElementById('editorMsg');if(msg)msg.textContent=mode==='add'?'새 스킬을 추가하고 저장했습니다.':'수정사항을 저장했습니다.';};
 const del=document.getElementById('deleteSkill');if(del)del.onclick=()=>{const x=selectedItem();if(!x)return;if(!confirm(`"${x.n}" 스킬을 삭제할까요?`))return;(x._kind==='active'?activeSkills:passives).splice(x._idx,1);saveData();render('edit');fillEditor('edit');};
 document.getElementById('resetCustom').onclick=()=>{if(!confirm('모든 사용자 수정사항을 지우고 기본 스킬로 복원할까요?'))return;activeSkills=JSON.parse(JSON.stringify(defaultActive));passives=JSON.parse(JSON.stringify(defaultPassives));saveData();render(mode);fillEditor(mode);};
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function aiSummary(){

 const activeFor = path => activeSkills.filter(s=>classifySkill(s)===path).map(s=>`[액티브] ${s.n} | MP ${s.mp===undefined?'미기재':s.mp} | 쿨타임 ${s.cd||'미기재'} | ${line(s)}`).join('\\n');
 const passiveFor = path => passives.filter(s=>classifySkill(s)===path).map(s=>`[패시브] ${s.n} | MP 소모 없음(패시브) | 쿨타임/내부 쿨타임: ${((s.desc||[]).filter(x=>/쿨타임|내부 쿨/i.test(x)).join(', '))||'별도 기재 없음'} | ${line(s)}`).join('\\n');
 const ruleText = rules.map(s=>`[공통 규칙] ${s.n}: ${line(s)}`).join('\\n');
 return `별수호자(Astral Guardian) — AI용 핵심 설정 요약
최대 MP: 500
방패 성좌의 길: 방어 / 아군 보호 / 군중 제어 / 축적형 반격

=== 방패 성좌의 길 · 액티브 ===
${activeFor('shield')}

=== 방패 성좌의 길 · 패시브 ===
${passiveFor('shield')}

=== 검 성좌의 길 · 액티브 ===
${activeFor('sword')}

${passiveFor('sword')}

=== 자원 및 공통 전투 규칙 ===

function downloadConfig(){
 const data=JSON.stringify(buildConfig(),null,2);
 const blob=new Blob([data],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='별수호자_설정.json';
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
 toast('최신 설정 JSON을 내보냈습니다.');
}
function importConfigFile(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const d=JSON.parse(String(reader.result||''));
   if(!d||d.schema!=='astral-guardian-config'||!Array.isArray(d.activeSkills)||!Array.isArray(d.passives)||!Array.isArray(d.rules))throw new Error('형식이 맞지 않습니다.');
   if(!d.activeSkills.every(x=>x&&typeof x.n==='string'&&Array.isArray(x.desc))||!d.passives.every(x=>x&&typeof x.n==='string'&&Array.isArray(x.desc)))throw new Error('스킬 데이터 형식이 올바르지 않습니다.');
   if(!confirm('불러오면 현재 브라우저의 액티브·패시브 설정이 파일 내용으로 교체됩니다. 계속할까요?'))return;
   activeSkills=d.activeSkills;passives=d.passives;rules=d.rules;
   saveData();
   render('active');
   toast('설정을 불러왔습니다.');
  }catch(e){alert('설정 파일을 불러오지 못했습니다. 별수호자 사이트에서 내보낸 JSON 파일인지 확인해 주세요.\\n'+e.message);}
 };
 reader.readAsText(file);
}
const CHARACTER_DEFAULT={level:50,exp:0,expToNext:1000,hp:1000,maxHp:1000,mp:500,maxMp:500,physicalDefense:100,magicalDefense:80,critChance:5,critDamage:150,damageReduction:0,evasion:5,str:10,dex:10,int:10,luk:10};
const EQUIPMENT_SLOTS=[['weapon','⚔','무기'],['shield','🛡','방패'],['helmet','♜','투구'],['armor','🥋','갑옷'],['gloves','🧤','장갑'],['boots','🥾','신발'],['accessory1','✧','장신구 I'],['accessory2','✧','장신구 II']];
function blankEquip(){return {name:'미장착',rarity:'일반',itemLevel:0,stats:'',effects:'',description:''};}
function loadCharacter(){try{const d=JSON.parse(localStorage.getItem('astralGuardianCharacterData')||'null');return {stats:{...CHARACTER_DEFAULT,...(d?.stats||{})},equipment:{...Object.fromEntries(EQUIPMENT_SLOTS.map(s=>[s[0],blankEquip()])),...(d?.equipment||{})}}}catch(e){return {stats:{...CHARACTER_DEFAULT},equipment:Object.fromEntries(EQUIPMENT_SLOTS.map(s=>[s[0],blankEquip()]))}}}
let characterData=loadCharacter(), characterTab='stats', selectedEquip='weapon';
function saveCharacter(){localStorage.setItem('astralGuardianCharacterData',JSON.stringify(characterData));toast('캐릭터 정보를 저장했습니다.');}
function statInput(label,key,suffix=''){return '<div class="stat-item"><label for="cs-'+key+'">'+label+(suffix?' ('+suffix+')':'')+'</label><input type="number" step="any" id="cs-'+key+'" data-cstat="'+key+'" value="'+esc(String(characterData.stats[key]??0))+'"></div>';}
function renderCharacter(){
 const c=document.getElementById('content');
 const tabs=innerTabs([['stats','캐릭터 능력치'],['equipment','장비 장착']],characterTab,'chartab');
 let h='<section class="subsection"><div class="group-label">캐릭터 정보</div>'+tabs+'</section>';
 if(characterTab==='stats'){
  h+='<div class="character-grid"><section class="stat-group"><h2>성장 정보</h2><div class="stat-grid">'+statInput('레벨','level')+statInput('현재 경험치','exp')+statInput('다음 레벨 필요 경험치','expToNext')+'</div></section>';
  h+='<section class="stat-group"><h2>생명력 · 마나</h2><div class="stat-grid">'+statInput('현재 HP','hp')+statInput('최대 HP','maxHp')+statInput('현재 MP','mp')+statInput('최대 MP','maxMp')+'</div></section>';
  h+='<section class="stat-group"><h2>방어 · 생존</h2><div class="stat-grid">'+statInput('물리 방어력','physicalDefense')+statInput('마법 방어력','magicalDefense')+statInput('데미지 경감률','damageReduction','%')+statInput('회피율','evasion','%')+'</div></section>';
  h+='<section class="stat-group"><h2>공격 · 치명타</h2><div class="stat-grid">'+statInput('치명타 확률','critChance','%')+statInput('치명타 피해','critDamage','%')+'</div></section>';
  h+='<section class="stat-group" style="grid-column:1/-1"><h2>기본 스탯</h2><div class="stat-grid">'+statInput('STR · 힘','str')+statInput('DEX · 민첩','dex')+statInput('INT · 지능','int')+statInput('LUK · 행운','luk')+'</div></section></div><div class="formactions"><button class="btn primary" id="saveCharStats">능력치 저장</button><button class="btn" id="resetCharStats">기본값으로 초기화</button></div><p class="notice">기록용 UI이며 수치가 전투 계산에 자동 적용되지는 않습니다. 백분율 항목은 % 단위로 입력하세요.</p>';
 }else{
  const eq=characterData.equipment[selectedEquip]||blankEquip(), slot=EQUIPMENT_SLOTS.find(s=>s[0]===selectedEquip);
  h+='<section class="card"><h2>장비 슬롯</h2><p class="en">장비 슬롯을 누르면 세부 정보를 확인하고 편집할 수 있습니다.</p><div class="equipment-grid">'+EQUIPMENT_SLOTS.map(s=>{const e=characterData.equipment[s[0]]||blankEquip();return '<button class="equip-slot" data-equip="'+s[0]+'"><span class="equip-icon">'+s[1]+'</span><span class="equip-name">'+esc(e.name||'미장착')+'</span><span class="equip-type">'+s[2]+' · '+esc(e.rarity||'일반')+'</span></button>';}).join('')+'</div></section>';
  h+='<section class="card" style="margin-top:12px"><h2>'+slot[2]+' 상세 정보</h2><div class="fieldgrid">'+field('장비 이름','eqName',eq.name||'미장착')+field('등급','eqRarity',eq.rarity||'일반')+field('장비 레벨','eqLevel',eq.itemLevel||0)+field('효과 / 옵션','eqEffects',eq.effects||'')+field('능력치 (한 줄에 하나씩)','eqStats',eq.stats||'',true,'textarea','STR: 15\n물리 방어력: 30\n치명타 확률: 5%')+field('상세 설명','eqDescription',eq.description||'',true,'textarea','장비의 효과와 설정을 기록하세요.')+'</div><div class="formactions"><button class="btn primary" id="saveEquip">장비 정보 저장</button><button class="btn" id="clearEquip">슬롯 비우기</button></div><p class="notice">장비 데이터는 캐릭터 능력치에 자동 합산되지 않습니다.</p></section>';
 }
 c.innerHTML=h;
 bindInnerTabs('chartab',v=>{characterTab=v;renderCharacter()});
 document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{selectedEquip=b.dataset.equip;renderCharacter()});
 const save=document.getElementById('saveCharStats');if(save)save.onclick=()=>{document.querySelectorAll('[data-cstat]').forEach(i=>{const n=Number(i.value);if(Number.isFinite(n))characterData.stats[i.dataset.cstat]=n});saveCharacter();renderCharacter()};
 const reset=document.getElementById('resetCharStats');if(reset)reset.onclick=()=>{if(confirm('캐릭터 능력치를 기본값으로 초기화할까요?')){characterData.stats={...CHARACTER_DEFAULT};saveCharacter();renderCharacter()}};
 const saveEq=document.getElementById('saveEquip');if(saveEq)saveEq.onclick=()=>{characterData.equipment[selectedEquip]={name:document.getElementById('eqName').value.trim()||'미장착',rarity:document.getElementById('eqRarity').value.trim()||'일반',itemLevel:Number(document.getElementById('eqLevel').value)||0,effects:document.getElementById('eqEffects').value.trim(),stats:document.getElementById('eqStats').value,description:document.getElementById('eqDescription').value};saveCharacter();renderCharacter()};
 const clear=document.getElementById('clearEquip');if(clear)clear.onclick=()=>{if(confirm('이 장비 슬롯을 비울까요?')){characterData.equipment[selectedEquip]=blankEquip();saveCharacter();renderCharacter()}};
}
let skillPath='shield', skillKind='active', manageMode='edit', aiMode='summary';
function classifySkill(x){const t=x.type||'';if(t.includes('검 성좌의 길'))return 'sword';if(t.includes('공용 스킬')||t.includes('성좌 전환'))return 'common';return 'shield';}
function innerTabs(items,selected,attribute){return `<div class="subtabs" role="tablist">${items.map(([id,label])=>`<button class="tab subtab ${selected===id?'active':''}" data-${attribute}="${id}">${label}</button>`).join('')}</div>`;}
function bindInnerTabs(attribute,callback){document.querySelectorAll('[data-'+attribute+']').forEach(b=>b.addEventListener('click',()=>callback(b.dataset[attribute])));}
function render(tab){
 // 이전 내부 호출과 새 상위 메뉴를 함께 지원
 if(tab==='active'||tab==='passive'){skillKind=tab;tab='skills';}
 if(tab==='edit'||tab==='add'){manageMode=tab;tab='manage';}
 if(tab==='prompt'||tab==='summary'){aiMode=tab;tab='ai';}
 const c=document.getElementById('content');
 document.querySelectorAll('.top-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const hints={
  skills:skillPath==='shield'?'방패 성좌: 방어·보호·제어·반격에 특화된 스킬':skillPath==='sword'?'검 성좌: 성흔·연계·약점 공략·폭딜에 특화된 스킬':'공용 스킬: 성좌 전환 등 두 경로에서 공통으로 사용하는 스킬',
  rules:'MP 회복과 공통 전투 규칙',
  manage:'스킬을 편집하거나 새 스킬을 등록합니다. 변경사항은 이 브라우저에 저장됩니다.',
  ai:aiMode==='summary'?'AI가 읽기 쉬운 핵심 수치 요약을 복사하거나 TXT로 저장합니다.':'설정 JSON을 내보내거나 불러오고, AI에 전달할 지시문을 복사합니다.',
  character:characterTab==='stats'?'캐릭터 능력치와 기본 스탯을 기록합니다.':'장비 슬롯을 선택해 장비 세부 정보를 확인하고 편집합니다.'
 };
 document.getElementById('hint').textContent=hints[tab]||'별수호자 설정';
 if(tab==='skills'){
  const pathTabs=innerTabs([['shield','🛡 방패 성좌의 길'],['sword','⚔ 검 성좌의 길'],['common','✦ 공용 스킬']],skillPath,'path');
  const kindTabs=innerTabs([['active','액티브 스킬'],['passive','패시브']],skillKind,'kind');
  const list=skillKind==='active'?activeSkills:passives;
  const filtered=list.filter(s=>classifySkill(s)===skillPath);
  c.innerHTML=`<section class="subsection"><div class="group-label">전투 경로 선택</div>${pathTabs}</section><section class="subsection"><div class="group-label">스킬 유형</div>${kindTabs}</section><div class="cards">${filtered.length?filtered.map(s=>card(s,skillKind==='active')).join(''):'<div class="card empty">이 경로에 등록된 스킬이 없습니다.</div>'}</div>`;
  bindInnerTabs('path',v=>{skillPath=v;render('skills')});
  bindInnerTabs('kind',v=>{skillKind=v;render('skills')});
 }
 if(tab==='rules')c.innerHTML=`<div class="cards">${rules.map(s=>card(s)).join('')}</div>`;
 if(tab==='manage'){
  const modeTabs=innerTabs([['edit','스킬 편집'],['add','스킬 추가']],manageMode,'manage');
  c.innerHTML=`<section class="subsection"><div class="group-label">스킬 관리</div>${modeTabs}</section>${editorForm(manageMode)}`;
  bindInnerTabs('manage',v=>{manageMode=v;render('manage')});
  fillEditor(manageMode);
 }
 if(tab==='character'){renderCharacter();}
 if(tab==='ai'){
  const aiTabs=innerTabs([['summary','핵심 요약 출력'],['prompt','설정 파일·프롬프트']],aiMode,'aimode');
  let aiContent='';
  if(aiMode==='summary')aiContent=`<section class="card"><h2>AI용 핵심 요약</h2><p>현재 설정의 스킬명, MP 소모, 쿨타임, 핵심 효과와 수치만 간결하게 정리합니다.</p><textarea class="promptbox" id="summaryText" spellcheck="false" style="min-height:420px">${esc(aiSummary())}</textarea><div class="prompt-actions"><button class="btn primary" id="copySummary">요약 복사</button><button class="btn" id="downloadSummary">TXT 파일 다운로드</button></div><p class="notice">방패 성좌와 검 성좌를 구분해 출력합니다. 최신 브라우저 저장 설정이 반영됩니다.</p></section>`;
  else aiContent=`<section class="card"><h2>AI 연동 · 설정 파일</h2><p>최신 설정을 JSON 파일로 내보낸 뒤 다른 AI 채팅에 첨부하세요.</p><div class="prompt-actions"><button class="btn primary" id="exportConfig">최신 설정 JSON 다운로드</button><button class="btn" id="importConfig">설정 JSON 불러오기</button><input class="importfile" type="file" id="configFile" accept=".json,application/json"></div><p class="notice">JSON에는 액티브 스킬, 패시브, 자원·전투 규칙이 포함됩니다. 불러오면 현재 설정이 파일 내용으로 교체됩니다.</p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>AI에 복사할 짧은 지시문</h2><p class="en">JSON을 첨부한 다음 이 지시문을 함께 보내세요.</p><textarea class="promptbox" id="prompt" spellcheck="false" style="min-height:210px">${esc(shortPrompt())}</textarea><div class="prompt-actions"><button class="btn primary" id="copyPrompt">짧은 프롬프트 복사</button><button class="btn" id="copyFullPrompt">전체 설정 프롬프트 복사</button></div><div class="notice">AI가 첨부 파일을 읽을 수 있는지는 사용하는 서비스에 따라 다릅니다.</div></section>`;
  c.innerHTML=`<section class="subsection"><div class="group-label">AI 보조 도구</div>${aiTabs}</section>${aiContent}`;
  bindInnerTabs('aimode',v=>{aiMode=v;render('ai')});
 }
 document.getElementById('copyCurrent').onclick=()=>{
  if(tab==='skills')copyText(textForTab(skillKind,skillPath));
  else if(tab==='rules')copyText(textForTab('rules'));
  else if(tab==='manage')copyText('스킬 관리 화면입니다. 복사할 스킬 목록은 성좌별 스킬 탭에서 선택하세요.');
  else if(tab==='ai')copyText(aiMode==='summary'?aiSummary():document.getElementById('prompt')?.value||shortPrompt());
  else if(tab==='character')copyText(characterTab==='stats'?JSON.stringify(characterData.stats,null,2):JSON.stringify(characterData.equipment,null,2));
 };
 const cs=document.getElementById('copySummary'); if(cs)cs.onclick=()=>copyText(document.getElementById('summaryText').value);
 const ds=document.getElementById('downloadSummary'); if(ds)ds.onclick=downloadSummary;
 const cp=document.getElementById('copyPrompt'); if(cp)cp.onclick=()=>copyText(document.getElementById('prompt').value);
 const full=document.getElementById('copyFullPrompt'); if(full)full.onclick=()=>copyText(textForTab('prompt'));
 const ex=document.getElementById('exportConfig'); if(ex)ex.onclick=downloadConfig;
 const im=document.getElementById('importConfig'), fi=document.getElementById('configFile');
 if(im&&fi){im.onclick=()=>fi.click();fi.onchange=()=>{importConfigFile(fi.files&&fi.files[0]);fi.value='';};}
}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('복사했습니다.')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('복사했습니다.');}}
function toast(s){let old=document.getElementById('toast');if(old)old.remove();let d=document.createElement('div');d.id='toast';d.textContent=s;d.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e7c778;color:#111827;padding:10px 16px;border-radius:10px;font-weight:700;box-shadow:0 5px 24px #0008;z-index:10';document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
document.querySelectorAll('.top-tab').forEach(b=>b.addEventListener('click',()=>render(b.dataset.tab)));
render('skills');
</script>
</body>
</html>
